name: Android APK
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: apk, cancel-in-progress: false }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Extrair projeto
        run: mkdir app && cd app && unzip -q ../projeto.zip
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Chave de assinatura fixa
        run: |
          if [ ! -f mise.keystore ]; then
            keytool -genkeypair -keystore mise.keystore -alias mise -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass misetakeat -keypass misetakeat -dname "CN=Mise, O=Takeat, C=BR"
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add mise.keystore && git commit -m "chore: chave de assinatura do APK [skip ci]" && git push
          fi
      - name: Build web (produção, sem ferramentas de teste)
        working-directory: app
        env: { VITE_BUILD: '${{ github.run_number }}' }
        run: npm install --no-audit --no-fund && npm run build
      - name: Compilar APK de produção (release, mesma chave dos builds anteriores)
        working-directory: app
        env: { BUILD_NUMBER: '${{ github.run_number }}', MISE_KEYSTORE: '${{ github.workspace }}/mise.keystore' }
        run: |
          npx cap sync android
          cd android && sed -i 's/\r$//' gradlew && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../../mise-build-${{ github.run_number }}.apk
          # Nome fixo: o TakeatHub (Central de documentos) baixa sempre de releases/latest/download/mise.apk
          cp app/build/outputs/apk/release/app-release.apk ../../mise.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mise-build-${{ github.run_number }}
          path: mise-build-${{ github.run_number }}.apk
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mise build ${{ github.run_number }}
          files: |
            mise-build-${{ github.run_number }}.apk
            mise.apk
          make_latest: true
